[project]
name = "relayops"
version = "0.1.0"
description = "RelayOps — an AI customer-service agent for telecom/subscription (portfolio vertical slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manideep" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Models
    "anthropic>=0.40",
    # Tool layer (MCP)
    "mcp>=1.0",
    # RAG
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # UI
    "streamlit>=1.38",
    # Misc
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "scikit-learn>=1.5",   # confusion matrix / classifier metrics
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
