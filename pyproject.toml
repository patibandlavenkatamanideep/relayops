[project]
name = "relayops"
version = "0.1.0"
description = "RelayOps — an AI customer-service agent for telecom/subscription (portfolio vertical slice)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Manideep" }]

dependencies = [
    # Orchestration
    "langgraph>=0.2",
    "langchain-core>=0.3",
    # Tool layer (MCP)
    "mcp>=1.0",
    # RAG
    "chromadb>=0.5",
    "rank-bm25>=0.2.2",
    # UI
    "streamlit>=1.38",
    # Service boundary (v1.8) — wraps the pipeline behind an HTTP API.
    # FastAPI + Starlette are pinned as a verified-compatible pair: a loose
    # `fastapi>=0.110` let environments resolve an old FastAPI against a new
    # Starlette, hitting `Router.__init__() got an unexpected keyword argument
    # 'on_startup'` during API test collection. Pinning both keeps local and CI
    # on the same working pair. Starlette must match the version the full
    # dependency graph resolves to (mcp / sse-starlette / streamlit pull
    # starlette 1.3.1); fastapi 0.137.1 accepts starlette>=0.46.0, so 1.3.1 is
    # in range. Keep this pin equal to constraints/railway.txt or the Railway
    # build fails with a starlette version conflict.
    "fastapi==0.137.1",
    "starlette==1.3.1",
    "uvicorn>=0.30",
    # Misc
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]
# NOTE: the Anthropic SDK is intentionally NOT a core dependency — it lives in the
# optional [llm] extra below. The served pipeline defaults to the deterministic
# template composer, so the base install (and public deploys like Railway) never
# pull in or use a frontier-model client.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff==0.15.16",       # pinned: formatter output must match CI exactly
    "scikit-learn>=1.5",   # confusion matrix / classifier metrics
    "httpx>=0.27",         # in-process ASGI client for the API tests
]
# Optional frontier-model arm: the LLM reply composer plus the Anthropic-based
# prompted classifier and LLM judge. Opt-in and double-gated — the served
# pipeline uses it only when RELAYOPS_COMPOSER=llm AND RELAYOPS_ALLOW_LLM=true AND
# ANTHROPIC_API_KEY are all set. Install locally (`pip install -e ".[llm]"`) to
# draft with a real model; keep it OUT of public deploys so they stay template-only.
llm = [
    "anthropic>=0.40",
]
# Real neural dense-retrieval arm (Anthropic's recommended embeddings partner).
# Without this the retriever falls back to the offline TF-IDF arm.
embeddings = [
    "voyageai>=0.3",
]
# LLM-as-judge providers (Step 5). Gemini gives a cross-family judge; the
# Anthropic judge uses the [llm] extra's anthropic SDK. Without either key the
# agent eval runs deterministic-only.
judge = [
    "google-genai>=0.3",
]
# Fine-tuning the Tier-1 intent classifier (Unsloth + LoRA) and serving it.
# GPU recommended for training. Without this the classifier registry's
# "finetuned" option is unavailable and eval uses keyword / Complement NB.
finetune = [
    "unsloth",
    "transformers>=4.44",
    "peft>=0.12",
    "trl>=0.9",
    "datasets>=2.20",
    "torch>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
# Colab-authored training notebooks are scratch artifacts, not product code.
extend-exclude = ["notebooks"]
